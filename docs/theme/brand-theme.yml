extends: default

page:
  size: A4
  margin: [2cm, 2cm, 2cm, 2cm]

base:
  font-family: BrandFont
  font-size: 10
  line-height: 1.4

heading:
  font-color: #003366
  font-style: bold

title-page:
  align: center
  title:
    font-size: 24
    font-color: #003366
  subtitle:
    font-size: 14

font:
  catalog:
    merge: true
    BrandFont:
      normal: ../fonts/Roboto-Regular.ttf
      bold: ../fonts/Roboto-Bold.ttf
      italic: ../fonts/Roboto-Italic.ttf

footer:
  recto:
    right:
      content: "{page-number}"
  verso:
    left:
      content: "{page-number}"